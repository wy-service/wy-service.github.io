<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D 旗舰级渲染器 V6 - 全环境稳定版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: -apple-system, sans-serif; }
        
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000;
            transition: opacity 0.4s; pointer-events: none; opacity: 0;
        }
        #overlay.active { opacity: 1; pointer-events: all; }
        
        .loader-bar { width: 240px; height: 2px; background: #222; margin-top: 15px; position: relative; }
        .loader-progress { position: absolute; width: 0%; height: 100%; background: #00ffcc; transition: width 0.2s; box-shadow: 0 0 10px #00ffcc; }
        #status-text { color: #eee; font-size: 13px; letter-spacing: 2px; }

        #ui-layer { position: fixed; top: 20px; left: 20px; z-index: 100; display: flex; flex-direction: column; gap: 12px; }
        .btn-upload {
            background: rgba(255,255,255,0.05); color: white; padding: 12px 24px;
            border-radius: 4px; cursor: pointer; font-size: 13px;
            border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(15px);
            transition: all 0.3s; text-align: center;
        }
        .btn-upload:hover { background: rgba(0,255,204,0.1); border-color: #00ffcc; color: #00ffcc; }
    </style>
</head>
<body>

    <div id="overlay">
        <div id="status-text">正在同步顶级环境贴图...</div>
        <div class="loader-bar"><div class="loader-progress" id="progress"></div></div>
    </div>

    <div id="ui-layer">
        <label class="btn-upload" for="file-input">📂 载入本地模型 (GLB/GLTF)</label>
        <input type="file" id="file-input" accept=".glb,.gltf" style="display:none">
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'lil-gui';

        // --- 稳定、高画质的 HDR 源 (精选 1K 快速加载版) ---
        const envPresets = {
            '【首选】专业白棚': 'https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr',
            '【推荐】现代展厅': 'https://threejs.org/examples/textures/equirectangular/royal_esplanade_1k.hdr',
            '【高反射】城市外滩': 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/shanghai_bund_1k.hdr',
            '【自然光】阿尔卑斯': 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/alps_field_1k.hdr'
        };

        const settings = {
            preset: '【首选】专业白棚',
            exposure: 1.0,
            envIntensity: 1.5,
            showBackground: true,
            showGrid: true,
            wireframe: false,
            autoRotate: false
        };

        // --- 初始化环境 ---
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 5, 10);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const gridHelper = new THREE.GridHelper(100, 80, 0x333333, 0x222222);
        scene.add(gridHelper);

        let currentModel = null;
        const rgbeLoader = new RGBELoader();
        const overlay = document.getElementById('overlay');
        const progressLine = document.getElementById('progress');
        const statusText = document.getElementById('status-text');

        // --- 加载环境主函数 ---
        function loadEnvironment(name) {
            const url = envPresets[name];
            overlay.classList.add('active');
            progressLine.style.width = '0%';
            statusText.innerText = `正在调配光影: ${name}`;

            rgbeLoader.load(url, (texture) => {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.environment = texture;
                updateScene();
                setTimeout(() => { overlay.classList.remove('active'); }, 500);
            }, (xhr) => {
                if (xhr.lengthComputable) {
                    const p = (xhr.loaded / xhr.total * 100);
                    progressLine.style.width = p + '%';
                }
            }, (err) => {
                overlay.classList.remove('active');
                alert('该环境资源加载失败，请尝试切换其他预设。');
                console.error(err);
            });
        }

        // --- 画面全局更新 ---
        function updateScene() {
            renderer.toneMappingExposure = settings.exposure;
            scene.background = settings.showBackground ? scene.environment : new THREE.Color(0x050505);
            gridHelper.visible = settings.showGrid;
            controls.autoRotate = settings.autoRotate;

            if (currentModel) {
                currentModel.traverse(child => {
                    if (child.isMesh && child.material) {
                        child.material.envMapIntensity = settings.envIntensity;
                        child.material.wireframe = settings.wireframe;
                    }
                });
            }
        }

        // --- 模型自适应算法 ---
        function autoFit(model) {
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            model.position.x += (model.position.x - center.x);
            model.position.y += (model.position.y - center.y);
            model.position.z += (model.position.z - center.z);
            const maxDim = Math.max(size.x, size.y, size.z);
            const cameraDist = maxDim * 1.8; 
            camera.position.set(cameraDist, cameraDist/1.5, cameraDist);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        // --- 文件载入 ---
        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            overlay.classList.add('active');
            statusText.innerText = '正在载入 3D 几何体...';
            new GLTFLoader().load(URL.createObjectURL(file), (gltf) => {
                if (currentModel) scene.remove(currentModel);
                currentModel = gltf.scene;
                scene.add(currentModel);
                autoFit(currentModel);
                updateScene();
                overlay.classList.remove('active');
            });
        });

        // --- 控制面板 ---
        const gui = new GUI({ title: '3D 旗舰展示系统 V6' });
        gui.add(settings, 'preset', Object.keys(envPresets)).name('🌍 环境预设').onChange(loadEnvironment);
        
        const fDisplay = gui.addFolder('👁 场景显示控制');
        fDisplay.add(settings, 'showBackground').name('显示背景实景').onChange(updateScene);
        fDisplay.add(settings, 'showGrid').name('显示地面网格').onChange(updateScene);
        fDisplay.add(settings, 'wireframe').name('显示模型线框').onChange(updateScene);
        
        const fParams = gui.addFolder('✨ 渲染精调');
        fParams.add(settings, 'exposure', 0, 3).name('曝光亮度').onChange(updateScene);
        fParams.add(settings, 'envIntensity', 0, 10).name('反射增强感').onChange(updateScene);
        fParams.add(settings, 'autoRotate').name('自动旋转展示').onChange(updateScene);

        // 首次加载
        loadEnvironment(settings.preset);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
